<title>TonyKitaab's personalized cinema</title>
<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Cinema</title>

    <script
        src="./cinema.js"
        defer>
    </script>

</head>

<body>

    <main class="cinema">

        <div class="screen">

            <iframe
                id="player"

                title="Cinema YouTube"

                allow="
                    autoplay;
                    encrypted-media;
                    picture-in-picture;
                    fullscreen
                "
                allowfullscreen>
            </iframe>

        </div>

    </main>

</body>
</html>
