<!doctype html>

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>TonyKitaab's personalized cinema</title>

	<link rel="stylesheet" href="cinema.css">

    <script src="./cinema.js" defer> </script>

</head>

<body>

    <main class="cinema">

        <div class="screen">

            <iframe
                id="player"

                title="Cinema YouTube"

                allow="
                    autoplay;
                    encrypted-media;
                    picture-in-picture;
                    fullscreen
                "
                allowfullscreen>
            </iframe>

        </div>

    </main>

</body>
</html>
